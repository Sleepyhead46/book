<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Book</title>

    <meta
        name="description"
        content="Read and download the digital edition of My Book."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
        }

        body {
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
        }

        .header p {
            margin: 0;
            color: #aaa;
            font-size: 16px;
            line-height: 1.6;
        }

        /* Buttons */
        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 13px 24px;

            background: #fff;
            color: #000;

            text-decoration: none;
            font-weight: 600;

            border-radius: 8px;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .button:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        .button.secondary {
            background: #161616;
            color: #fff;
            border: 1px solid #333;
        }

        /* PDF Viewer */
        .pdf-wrapper {
            width: 100%;
            height: 80vh;
            min-height: 600px;

            overflow: hidden;

            background: #111;
            border: 1px solid #292929;
            border-radius: 12px;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;

            border: none;
            display: block;

            background: #111;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 25px 0 10px;
            color: #666;
            font-size: 13px;
        }

        /* Mobile */
        @media (max-width: 768px) {

            .container {
                padding: 20px 10px;
            }

            .header {
                margin-bottom: 15px;
            }

            .actions {
                margin: 18px 0;
            }

            .button {
                width: 100%;
                max-width: 320px;
            }

            .pdf-wrapper {
                height: 75vh;
                min-height: 500px;
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Book Header -->
        <header class="header">

            <h1>My Book</h1>

            <p>
                Read the complete digital edition below.
            </p>

        </header>


        <!-- Actions -->
        <div class="actions">

            <!-- Download -->
            <a
                class="button"
                href="book.pdf"
                download="My-Book.pdf"
            >
                Download PDF
            </a>

            <!-- Open PDF -->
            <a
                class="button secondary"
                href="book.pdf"
                target="_blank"
                rel="noopener noreferrer"
            >
                Open Full Screen
            </a>

        </div>


        <!-- PDF Viewer -->
        <section
            class="pdf-wrapper"
            aria-label="Book PDF viewer"
        >

            <iframe
                class="pdf-viewer"
                src="book.pdf"
                title="My Book PDF"
            >
            </iframe>

        </section>


        <!-- Footer -->
        <footer class="footer">

            <p>
                © 2026 My Book. All rights reserved.
            </p>

        </footer>

    </main>

</body>
</html>
