<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Book</title>

    <meta
        name="description"
        content="Read the digital edition of My Book."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #000;
            color: #fff;
        }

        .container {
            width: min(90%, 700px);
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            color: #aaa;
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;

            background: #fff;
            color: #000;

            text-decoration: none;
            font-weight: bold;

            border-radius: 8px;
        }

        .button:hover {
            opacity: 0.85;
        }

        .download {
            display: block;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
        }

        .download:hover {
            color: #fff;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>My Book</h1>

        <p>
            Read the complete digital edition of this book.
        </p>

        <a
            class="button"
            href="book.pdf"
            target="_blank"
        >
            Read Book
        </a>

        <a
            class="download"
            href="book.pdf"
            download
        >
            Download PDF
        </a>

    </main>

</body>
</html>
